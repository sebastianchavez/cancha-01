<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — Golazo Sports Club</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-page="contacto" class="bg-slate-50">

  <!-- HERO -->
  <section class="bg-gradient-to-br from-green-600 to-blue-700 text-white py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="max-w-3xl">
        <span class="inline-block px-3 py-1 bg-white/20 backdrop-blur-sm rounded-full text-xs font-bold uppercase tracking-wider mb-4">Contacto</span>
        <h1 class="text-4xl md:text-5xl font-black mb-4">¿Hablamos?</h1>
        <p class="text-lg text-white/90">Estamos para ayudarte. Visítanos, escríbenos o llámanos.</p>
      </div>
    </div>
  </section>

  <section class="py-12 -mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="grid lg:grid-cols-3 gap-6">
        <!-- FORM -->
        <div class="lg:col-span-2 bg-white rounded-2xl shadow-lg p-8 border border-slate-200">
          <h2 class="text-2xl font-black text-slate-900 mb-1">Envíanos un mensaje</h2>
          <p class="text-slate-600 text-sm mb-6">Completa el formulario y te responderemos a la brevedad.</p>
          <form id="contact-form" class="space-y-4">
            <div class="grid md:grid-cols-2 gap-4">
              <div>
                <label class="field-label">Nombre *</label>
                <input type="text" id="c-name" required class="field-input" placeholder="Tu nombre">
              </div>
              <div>
                <label class="field-label">Correo *</label>
                <input type="email" id="c-email" required class="field-input" placeholder="tu@correo.com">
              </div>
            </div>
            <div class="grid md:grid-cols-2 gap-4">
              <div>
                <label class="field-label">Teléfono</label>
                <input type="tel" id="c-phone" class="field-input" placeholder="987654321">
              </div>
              <div>
                <label class="field-label">Asunto *</label>
                <select id="c-subject" required class="field-input">
                  <option value="">Seleccionar asunto</option>
                  <option value="Reserva">Reserva de cancha</option>
                  <option value="Torneo">Torneo o evento</option>
                  <option value="Clases">Clases y escuela</option>
                  <option value="Membresia">Membresías</option>
                  <option value="Sugerencia">Sugerencia</option>
                  <option value="Otro">Otro</option>
                </select>
              </div>
            </div>
            <div>
              <label class="field-label">Mensaje *</label>
              <textarea id="c-message" required rows="5" class="field-input" placeholder="Cuéntanos en qué podemos ayudarte..."></textarea>
            </div>
            <button type="submit" class="btn-gradient w-full md:w-auto justify-center">
              <span>Enviar mensaje</span>
            </button>
          </form>
        </div>

        <!-- INFO -->
        <div class="space-y-6">
          <div class="bg-white rounded-2xl shadow-lg p-6 border border-slate-200">
            <h3 class="font-bold text-slate-900 mb-4">Información</h3>
            <div class="space-y-4 text-sm">
              <div class="flex items-start gap-3">
                <div class="w-9 h-9 rounded-lg bg-green-100 flex items-center justify-center flex-shrink-0">
                  <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </div>
                <div>
                  <div class="font-semibold text-slate-900">Dirección</div>
                  <div class="text-slate-600" id="address-info"></div>
                </div>
              </div>
              <div class="flex items-start gap-3">
                <div class="w-9 h-9 rounded-lg bg-blue-100 flex items-center justify-center flex-shrink-0">
                  <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                </div>
                <div>
                  <div class="font-semibold text-slate-900">Teléfono</div>
                  <a id="phone-info" href="#" class="text-slate-600 hover:text-green-600"></a>
                </div>
              </div>
              <div class="flex items-start gap-3">
                <div class="w-9 h-9 rounded-lg bg-yellow-100 flex items-center justify-center flex-shrink-0">
                  <svg class="w-4 h-4 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                </div>
                <div>
                  <div class="font-semibold text-slate-900">Email</div>
                  <a id="email-info" href="#" class="text-slate-600 hover:text-green-600"></a>
                </div>
              </div>
            </div>
          </div>

          <!-- HORARIOS -->
          <div class="bg-white rounded-2xl shadow-lg p-6 border border-slate-200">
            <h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2">
              <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              Horarios de atención
            </h3>
            <div class="space-y-2 text-sm" id="horarios-list"></div>
          </div>
        </div>
      </div>

      <!-- MAPA -->
      <div class="mt-8 bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-200">
        <div class="aspect-[21/9] bg-slate-200 relative">
          <iframe
            src="https://www.openstreetmap.org/export/embed.html?bbox=-77.05,-12.05,-77.03,-12.04&amp;layer=mapnik&amp;marker=-12.0464,-77.0428"
            class="absolute inset-0 w-full h-full"
            style="border:0;"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>
        <div class="p-4 bg-slate-50 flex items-center justify-between">
          <p class="text-sm text-slate-600">📍 Av. Deportiva 123, San Miguel, Lima</p>
          <a href="https://www.google.com/maps?q=-12.0464,-77.0428" target="_blank" class="text-sm text-green-600 hover:text-green-700 font-semibold">Ver en Google Maps →</a>
        </div>
      </div>
    </div>
  </section>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    UI.mountLayout('contacto');
    const b = Catalog.business();

    document.getElementById('address-info').textContent = b.direccion;
    document.getElementById('phone-info').textContent = b.telefono;
    document.getElementById('phone-info').href = 'tel:' + b.telefono.replace(/\s/g, '');
    document.getElementById('email-info').textContent = b.email;
    document.getElementById('email-info').href = 'mailto:' + b.email;

    document.getElementById('horarios-list').innerHTML = Catalog.horarios().map(h => `
      <div class="flex justify-between items-center py-1.5 border-b border-slate-100 last:border-0">
        <span class="font-medium text-slate-700">${h.dia}</span>
        <span class="text-slate-600">${h.atencion}</span>
      </div>
    `).join('');

    document.getElementById('contact-form').addEventListener('submit', e => {
      e.preventDefault();
      try {
        Contacto.create({
          name: document.getElementById('c-name').value,
          email: document.getElementById('c-email').value,
          phone: document.getElementById('c-phone').value,
          subject: document.getElementById('c-subject').value,
          message: document.getElementById('c-message').value
        });
        UI.toast('¡Mensaje enviado! Te contactaremos pronto.', 'success');
        e.target.reset();
      } catch (err) {
        UI.toast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
