<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil — Golazo Sports Club</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-page="perfil" class="bg-slate-50">

  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="login-required" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-12 text-center">
      <div class="w-16 h-16 mx-auto rounded-full bg-yellow-100 flex items-center justify-center mb-4">
        <svg class="w-8 h-8 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      </div>
      <h3 class="text-lg font-bold text-slate-900 mb-2">Inicia sesión para ver tu perfil</h3>
      <p class="text-slate-600 mb-6">Necesitas estar autenticado para acceder a tu perfil.</p>
      <a href="login.html?redirect=perfil.html" class="btn-gradient">Iniciar sesión</a>
    </div>

    <div id="perfil-wrap" class="hidden">
      <!-- HEADER -->
      <div class="bg-gradient-to-br from-green-600 to-blue-700 rounded-2xl shadow-lg p-6 mb-6 text-white">
        <div class="flex flex-col sm:flex-row items-center gap-4">
          <div class="w-20 h-20 rounded-full bg-white/20 backdrop-blur-sm flex items-center justify-center text-3xl font-black" id="user-avatar">U</div>
          <div class="flex-1 text-center sm:text-left">
            <h1 class="text-2xl md:text-3xl font-black" id="user-name">Usuario</h1>
            <p class="text-white/80" id="user-email">—</p>
            <p class="text-white/60 text-xs mt-1">Miembro desde <span id="user-since">—</span></p>
          </div>
          <div class="grid grid-cols-3 gap-3">
            <div class="bg-white/10 backdrop-blur-sm rounded-lg px-4 py-2 text-center">
              <div class="text-2xl font-black text-yellow-300" id="stat-total">0</div>
              <div class="text-[10px] uppercase tracking-wider">Total</div>
            </div>
            <div class="bg-white/10 backdrop-blur-sm rounded-lg px-4 py-2 text-center">
              <div class="text-2xl font-black text-yellow-300" id="stat-proximas">0</div>
              <div class="text-[10px] uppercase tracking-wider">Próximas</div>
            </div>
            <div class="bg-white/10 backdrop-blur-sm rounded-lg px-4 py-2 text-center">
              <div class="text-2xl font-black text-yellow-300" id="stat-completadas">0</div>
              <div class="text-[10px] uppercase tracking-wider">Jugadas</div>
            </div>
          </div>
        </div>
      </div>

      <div class="grid lg:grid-cols-3 gap-6">
        <!-- COL IZQ - DATOS -->
        <div class="space-y-6">
          <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="font-bold text-slate-900 mb-4">Mis datos</h2>
            <form id="profile-form" class="space-y-3">
              <div>
                <label class="field-label">Nombre</label>
                <input id="p-name" type="text" required class="field-input">
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="field-label">Teléfono</label>
                  <input id="p-phone" type="tel" required class="field-input" maxlength="9">
                </div>
                <div>
                  <label class="field-label">DNI</label>
                  <input id="p-dni" type="text" class="field-input" maxlength="8">
                </div>
              </div>
              <div>
                <label class="field-label">Correo</label>
                <input id="p-email" type="email" disabled class="field-input bg-slate-100">
              </div>
              <button type="submit" class="w-full px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-md">Guardar cambios</button>
            </form>
          </section>

          <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="font-bold text-slate-900 mb-4">Cambiar contraseña</h2>
            <form id="password-form" class="space-y-3">
              <div>
                <label class="field-label">Contraseña actual</label>
                <input id="p-current" type="password" required class="field-input">
              </div>
              <div>
                <label class="field-label">Nueva contraseña</label>
                <input id="p-new" type="password" required class="field-input" minlength="6">
              </div>
              <div>
                <label class="field-label">Confirmar</label>
                <input id="p-confirm" type="password" required class="field-input">
              </div>
              <button type="submit" class="w-full px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-md">Actualizar contraseña</button>
            </form>
          </section>
        </div>

        <!-- COL DER - HISTORIAL -->
        <div class="lg:col-span-2">
          <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 border-b border-slate-200">
              <h2 class="text-xl font-black text-slate-900">Historial de reservas</h2>
              <div class="flex flex-wrap gap-1 mt-3 border-b border-slate-200 -mb-px" id="tabs">
                <button class="tab-btn active" data-tab="proximas">Próximas</button>
                <button class="tab-btn" data-tab="pendientes">Pendientes</button>
                <button class="tab-btn" data-tab="pasadas">Pasadas</button>
                <button class="tab-btn" data-tab="canceladas">Canceladas</button>
                <button class="tab-btn" data-tab="todas">Todas</button>
              </div>
            </div>
            <div id="reservas-list" class="divide-y divide-slate-100"></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/reservas.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    UI.mountLayout('perfil');

    if (!Session.isLogged()) {
      document.getElementById('login-required').classList.remove('hidden');
    } else {
      document.getElementById('perfil-wrap').classList.remove('hidden');
      const user = Session.current();

      // Datos
      document.getElementById('user-avatar').textContent = user.name.charAt(0).toUpperCase();
      document.getElementById('user-name').textContent = user.name;
      document.getElementById('user-email').textContent = user.email;
      document.getElementById('user-since').textContent = formatDate(user.createdAt, { short: true });
      document.getElementById('p-name').value = user.name;
      document.getElementById('p-phone').value = user.phone;
      document.getElementById('p-dni').value = user.dni || '';
      document.getElementById('p-email').value = user.email;

      // Estadísticas
      const all = Reservas.byUser(user.id);
      document.getElementById('stat-total').textContent = all.length;
      const today = todayISO();
      document.getElementById('stat-proximas').textContent = all.filter(r => r.date >= today && r.status !== 'cancelada').length;
      document.getElementById('stat-completadas').textContent = all.filter(r => r.status === 'completada').length;

      // Tabs
      let currentTab = 'proximas';
      function render() {
        const list = ReservaFlow.filterByStatus(user.id, currentTab);
        const container = document.getElementById('reservas-list');
        if (!list.length) {
          container.innerHTML = `
            <div class="p-12 text-center">
              <div class="w-16 h-16 mx-auto rounded-full bg-slate-100 flex items-center justify-center mb-3">
                <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
              </div>
              <p class="text-slate-600 text-sm">No tienes reservas en esta categoría.</p>
            </div>
          `;
          return;
        }
        container.innerHTML = list.map(r => {
          const cancha = Catalog.canchasById(r.courtId);
          return `
            <a href="reserva-detalle.html?id=${r.id}" class="block p-5 hover:bg-slate-50 transition-colors">
              <div class="flex items-center gap-4">
                <div class="w-16 h-16 rounded-lg bg-slate-100 flex-shrink-0 overflow-hidden">
                  <img src="${UI.courtImage(cancha, { w: 100, h: 100 })}" class="w-full h-full object-cover">
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 mb-1">
                    <h3 class="font-bold text-slate-900 truncate">${cancha.nombre}</h3>
                    ${UI.statusBadge(r.status)}
                  </div>
                  <p class="text-sm text-slate-600">${formatDate(r.date, { short: true })} · ${r.startTime} (${r.duration}h) · ${r.players} jugadores</p>
                  <p class="text-xs text-slate-500 mt-1">${cancha.tipo} · ${cancha.superficie}</p>
                </div>
                <div class="text-right flex-shrink-0">
                  <div class="font-black text-green-600">${formatCurrency(r.total)}</div>
                  <svg class="w-5 h-5 text-slate-400 inline mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </div>
              </div>
            </a>
          `;
        }).join('');
      }

      document.querySelectorAll('#tabs button').forEach(btn => {
        btn.addEventListener('click', () => {
          currentTab = btn.dataset.tab;
          document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          render();
        });
      });

      // Form perfil
      document.getElementById('profile-form').addEventListener('submit', e => {
        e.preventDefault();
        try {
          Auth.updateProfile({
            name: document.getElementById('p-name').value,
            phone: document.getElementById('p-phone').value,
            dni: document.getElementById('p-dni').value
          });
          UI.toast('Datos actualizados', 'success');
          setTimeout(() => location.reload(), 600);
        } catch (err) {
          UI.toast(err.message, 'error');
        }
      });

      // Form contraseña
      document.getElementById('password-form').addEventListener('submit', e => {
        e.preventDefault();
        try {
          Auth.changePassword(
            document.getElementById('p-current').value,
            document.getElementById('p-new').value,
            document.getElementById('p-confirm').value
          );
          UI.toast('Contraseña actualizada', 'success');
          e.target.reset();
        } catch (err) {
          UI.toast(err.message, 'error');
        }
      });

      render();
    }
  </script>
</body>
</html>
